version: "3.9"

# ── Local development stack ───────────────────────────────────────────────────
#
# Quick start:
#   cp .env.example .env        # fill in JWT_KEY, SEED_ADMIN_* at minimum
#   docker compose up --build
#
# API    → http://localhost:8080
# Swagger→ http://localhost:8080/openapi/ui
#
# To use Supabase instead of the local DB:
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Local PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-churchattendance}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ASP.NET Core API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ── Database (local postgres) ──────────────────────────────────────
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-churchattendance};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"

      # ── JWT (required — set in .env) ───────────────────────────────────
      JWTSettings__Issuer:          ${JWT_ISSUER:-https://api.yourchurch.org}
      JWTSettings__Audience:        ${JWT_AUDIENCE:-https://ecclisiya.vercel.app}
      JWTSettings__Key:             ${JWT_KEY}
      JWTSettings__Expiration_Mins: ${JWT_EXPIRATION_MINS:-10}

      RefreshToken__Expiration_Mins: ${REFRESH_TOKEN_EXPIRATION_MINS:-30}

      # ── Seed admin (first boot only) ────────────────────────────────────
      SeedAdmin__PhoneNumber: ${SEED_ADMIN_PHONE}
      SeedAdmin__Password:    ${SEED_ADMIN_PASSWORD}
      SeedAdmin__PersonName:  ${SEED_ADMIN_NAME:-Administrator}

      # ── CORS ────────────────────────────────────────────────────────────
      AllowedOrigins__0: ${ALLOWED_ORIGIN_0:-http://localhost:5173}
      AllowedOrigins__1: ${ALLOWED_ORIGIN_1:-https://ecclisiya.vercel.app}

volumes:
  postgres_data:
